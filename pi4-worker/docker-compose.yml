services:
  weboffers-pi4-bot:
    build: .
    container_name: weboffers-pi4-bot
    restart: unless-stopped
    environment:
      - AMAZON_US_TAG=knunet-20
      - AMAZON_ES_TAG=knunet-21
      - SITE_URL=https://ofertas.knunet.com
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
