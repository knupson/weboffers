services:
  weboffers-worker:
    build: .
    restart: unless-stopped
    environment:
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-3600}
      CATALOG_PATH: /app/data/catalog.json
      OUTPUT_PATH: /app/output/offers.json
      CREATORS_CLIENT_ID: ${CREATORS_CLIENT_ID:-}
      CREATORS_CLIENT_SECRET: ${CREATORS_CLIENT_SECRET:-}
      CREATORS_PARTNER_TAG_US: ${CREATORS_PARTNER_TAG_US:-}
      CREATORS_PARTNER_TAG_ES: ${CREATORS_PARTNER_TAG_ES:-}
      CF_DEPLOY_HOOK_URL: ${CF_DEPLOY_HOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_STATE_PATH: /app/output/telegram-state.json
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      ML_PRICES_PATH: /app/output/ml-prices.json
      AMAZON_SCRAPER_URL: ${AMAZON_SCRAPER_URL:-http://weboffers-amazon-scraper:8000}
      AMAZON_AR_URL: ${AMAZON_AR_URL:-http://weboffers-amazon-ar:8001}
      AMAZON_PRICES_PATH: /app/output/amazon-prices.json
    volumes:
      - ../data:/app/data:ro
      - ./output:/app/output
      # Solo para correr tools/ml_catalog_map.py dentro del contenedor.
      - ../tools:/app/tools:ro

  weboffers-amazon-scraper:
    build: https://github.com/omkarcloud/amazon-scraper.git#8ffd4f976c705d009ec06d8e4e3e15fc77e35cee
    restart: unless-stopped
    # 05/11: con 256m el kernel lo mató 3 veces (OOM a ~259 MB); en reposo usa ~150 MB. VM con 8,7 GB libres.
    mem_limit: 512m

  weboffers-amazon-ar:
    build:
      context: .
      dockerfile: amazon-ar/Dockerfile
    restart: unless-stopped
    mem_limit: 256m

  weboffers-barrido:
    build:
      context: .
      dockerfile: barrido/Dockerfile
      args:
        BARRIDO_GIT_COMMIT: ${BARRIDO_GIT_COMMIT:-no_disponible}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      BARRIDO_OUTPUT: /app/output/barrido
      # Salida a Amazon por WARP: la IP de la VM recibe 503 en /s (medido 07/11).
      BARRIDO_AMAZON_PROXY: socks5h://weboffers-warp:1080
      BARRIDO_CHROME_CDP: http://192.168.240.10:9222
    networks: [default, barrido-cdp]
    depends_on:
      weboffers-warp:
        condition: service_started
      weboffers-chrome:
        condition: service_healthy
      weboffers-chrome-cdp:
        condition: service_started
    volumes:
      - ./output:/app/output
      - ../data:/app/data:ro

  weboffers-chrome:
    image: lscr.io/linuxserver/chrome@sha256:b60948cf017ac5c2476a975a44f0ad02b54bf9783ea8b845ba260ba45d24299a
    restart: unless-stopped
    # 07/11: con 1g Amazon dejó a Chrome OOMKilled en plena búsqueda; el pico real queda por medir.
    mem_limit: 2g
    shm_size: 1gb
    environment:
      CHROME_CLI: --user-data-dir=/config/chrome-profile --remote-debugging-port=9222
    volumes:
      - ./chrome-barrido:/config
      # Borra SingletonLock/Socket/Cookie al arrancar: tras recrear el contenedor Chrome no abría el CDP.
      - ./chrome-init:/custom-cont-init.d:ro
    # Aislado: NO está en la red default (worker, scraper, deployer no lo alcanzan). barrido-cdp es interna
    # (sólo barrido ↔ Chrome); chrome-salida le da internet. El escritorio web (:3000/:3001) queda sin
    # puertos al host y sólo alcanzable desde barrido-cdp. Perfil sin cuenta de Amazon logueada.
    networks:
      barrido-cdp:
        ipv4_address: 192.168.240.10
      chrome-salida: {}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9222/json/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Comparte la red de Chrome: escucha sólo en su IP de Docker y reenvía al
  # CDP de loopback. No ocupa 127.0.0.1:9222 ni publica puertos al host.
  weboffers-chrome-cdp:
    build: ./chrome-cdp
    restart: unless-stopped
    network_mode: service:weboffers-chrome
    environment:
      CDP_BIND_IP: 192.168.240.10
      CDP_ALLOWED: 192.168.240.0/24
    depends_on:
      weboffers-chrome:
        condition: service_healthy

  # Cloudflare WARP como proxy SOCKS5/HTTP en :1080, sólo dentro de la red del compose (sin puertos al host).
  # Imagen comunitaria (github.com/cmj2002/warp-docker), fijada por digest; medido 07/11: 82,6 MiB.
  weboffers-warp:
    image: caomingjun/warp@sha256:2891b92420a193a49c74cbd4387bee91f5c35fbc487fca8e8f739baed52c1d2b
    restart: unless-stopped
    mem_limit: 256m
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      - WARP_SLEEP=2
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./warp-data:/var/lib/cloudflare-warp

  weboffers-deployer:
    build: ./deployer
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2.0
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    volumes:
      - ./output:/app/output:ro
      - deployer-work:/work
      - deployer-state:/state

volumes:
  deployer-work:
  deployer-state:

networks:
  # Sólo barrido ↔ Chrome (CDP 9222). Interna: sin salida a internet. Subred libre en la VM (medido 07/11).
  barrido-cdp:
    internal: true
    ipam:
      config:
        - subnet: 192.168.240.0/24
  # Salida a internet sólo para Chrome; ningún otro servicio se une.
  chrome-salida: {}
