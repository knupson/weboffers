services:
  weboffers-worker:
    build: .
    restart: unless-stopped
    environment:
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-3600}
      CATALOG_PATH: /app/data/catalog.json
      OUTPUT_PATH: /app/output/offers.json
      CREATORS_CLIENT_ID: ${CREATORS_CLIENT_ID:-}
      CREATORS_CLIENT_SECRET: ${CREATORS_CLIENT_SECRET:-}
      CREATORS_PARTNER_TAG_US: ${CREATORS_PARTNER_TAG_US:-}
      CREATORS_PARTNER_TAG_ES: ${CREATORS_PARTNER_TAG_ES:-}
      CF_DEPLOY_HOOK_URL: ${CF_DEPLOY_HOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_STATE_PATH: /app/output/telegram-state.json
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      ML_PRICES_PATH: /app/output/ml-prices.json
      AMAZON_SCRAPER_URL: ${AMAZON_SCRAPER_URL:-http://weboffers-amazon-scraper:8000}
      AMAZON_AR_URL: ${AMAZON_AR_URL:-http://weboffers-amazon-ar:8001}
      AMAZON_PRICES_PATH: /app/output/amazon-prices.json
    volumes:
      - ../data:/app/data:ro
      - ./output:/app/output
      # Solo para correr tools/ml_catalog_map.py dentro del contenedor.
      - ../tools:/app/tools:ro

  weboffers-amazon-scraper:
    build: https://github.com/omkarcloud/amazon-scraper.git#8ffd4f976c705d009ec06d8e4e3e15fc77e35cee
    restart: unless-stopped
    # 05/11: con 256m el kernel lo mató 3 veces (OOM a ~259 MB); en reposo usa ~150 MB. VM con 8,7 GB libres.
    mem_limit: 512m

  weboffers-amazon-ar:
    build:
      context: .
      dockerfile: amazon-ar/Dockerfile
    restart: unless-stopped
    mem_limit: 256m

  weboffers-barrido:
    build:
      context: .
      dockerfile: barrido/Dockerfile
      args:
        BARRIDO_GIT_COMMIT: ${BARRIDO_GIT_COMMIT:-no_disponible}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      BARRIDO_OUTPUT: /app/output/barrido
      # Salida a Amazon por WARP: la IP de la VM recibe 503 en /s (medido 07/11).
      BARRIDO_AMAZON_PROXY: socks5h://weboffers-warp:1080
    depends_on:
      - weboffers-warp
    volumes:
      - ./output:/app/output
      - ../data:/app/data:ro

  # Cloudflare WARP como proxy SOCKS5/HTTP en :1080, sólo dentro de la red del compose (sin puertos al host).
  # Imagen comunitaria (github.com/cmj2002/warp-docker), fijada por digest; medido 07/11: 82,6 MiB.
  weboffers-warp:
    image: caomingjun/warp@sha256:2891b92420a193a49c74cbd4387bee91f5c35fbc487fca8e8f739baed52c1d2b
    restart: unless-stopped
    mem_limit: 256m
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      - WARP_SLEEP=2
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./warp-data:/var/lib/cloudflare-warp

  weboffers-deployer:
    build: ./deployer
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2.0
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    volumes:
      - ./output:/app/output:ro
      - deployer-work:/work
      - deployer-state:/state

volumes:
  deployer-work:
  deployer-state:
